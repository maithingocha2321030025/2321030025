<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <style>
        h2{
            color:pink;
            background-color:black;
        }
    

    
        h3{
            color:blue;
            background-color:red;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- cách 1:inline style -->
     <!-- color :quy định màu chữ -->
      <!-- background-color quy định màu nền -->
       <h1 style="color:blue;background-color:orange">Bài STYLE</h1>

    <!-- cách 2 internal Style -->
     <h2>Cách 2 internal Style</h2>
     <h3>Mai Thị Ngọc Hà</h3>

     <!-- cách 3 external style -->
<h4>Mai Thị Ngọc Hà</h4>
    
</body>
</html>
