<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>OpenAI - Codex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <a href="#" class="logo">OpenAI</a>
        <a href="#" class="login">Log in</a>
    </header>

    <!-- MAIN CONTAINER (CHỨA TRỰC TIẾP 3 CỘT) -->
    <div class="main-container">

        <!-- CỘT 1: MENU -->
        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">API Platform</a></li>
            <li><a href="#">API Pricing</a></li>
            <li><a href="#" class="active">Codex</a></li>
            <li><a href="#">Open Models</a></li>
            <li><a href="#">Community</a></li>
        </ul>

        <!-- CỘT 2: NỘI DUNG (TÁCH RIÊNG RA KHỎI MENU) -->
        <div class="noi-dung">
            <h1>Codex</h1>
            <p>One agent for everywhere you code-included in ChatGPT Plus, Pro, Business, Edu, and Enterprise plans.</p>
            
            <div class="khoi-nut">
                <a href="#" class="btn-get-started">Get started</a>
                <div class="command">$ npm ig @openai/codex</div>
            </div>
        </div>

        <!-- CỘT 3: HÌNH ẢNH BÊN PHẢI -->
        <div class="cot-phai">
            <div class="anh-trai">
                <!-- box-img Ô vuông đóng vai trò là khung chứa hình ảnh/màu nền. -->
                 <!-- or dùng <img src="LINK_ANH" ...> và dùng thuộc tính alt để mô tả ảnh thay cho box-img. -->
                <div class="box-img box-1">    
                    <!-- "badge": Nhãn dán chữ màu trắng nổi đè lên trên ô ảnh.  -->
                    <div class="badge">Code review</div>
                </div>
                <div class="box-img box-2">
                    <div class="badge">eb/agi</div>
                </div>
            </div>

            <div class="anh-phai">
                <div class="box-img box-3">
                    <div class="badge">Searching code</div>
                </div>
                <div class="box-img box-4">
                    <div class="badge">Merged +27 -15</div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
