<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 9</title>
    <style>
        .khoi{
            text-align:center;
        }
        img{
            width:20%;
        }
    </style>
</head>
<body>
    <div class="khoi">
   ,<h1>chế độ sáng</h1>
   <img src="../ảnh/mattroi.jpg"alt="">
   <div>
    <button onclick="doiCheDo()">đổi chế độ</button>
   </div>
    </div>
<script>
    // true:sáng/false:tối
    var cheDoHienTai=true;
    function doiCheDo(){
        if(cheDoHienTai==true){
        document.getElementsByTagName("body")[0].style="background-color:black";
        document.getElementsByTagName("h1")[0].innerHTML="chế độ tối";
        document.getElementsByTagName("h1")[0].style="color:white";
        document.getElementsByTagName("img")[0].src="../ảnh/mattrang.jpg";
        cheDoHienTai=false;

    }
    else{
      document.getElementsByTagName("body")[0].style="background-color:white";
        document.getElementsByTagName("h1")[0].innerHTML="chế độ sáng";
        document.getElementsByTagName("h1")[0].style="color:black";
        document.getElementsByTagName("img")[0].src="../ảnh/mattroi.jpg";
        cheDoHienTai=true;  
        }
    }
</script>

    
</body>
</html>
