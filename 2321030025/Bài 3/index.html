<html>
    <head>
        <title>Bài 3</title>
    </head>
    <body>
        <MARQUEE>
            <img src="../ảnh/hà.jpg">
        </MARQUEE>
         <!-- ol Danh sách có thứ tự -->
          <ol>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
          </ol>
<!-- ul Danh sách không có thứ tự -->
          <ul>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
          </ul>



          <h1>Form đăng kí</h1>
          <form>
            <div>
                <b>Họ và tên:</b><br>
                <!-- nếu input không có type thì sẽ mặc định là text -->
                 <!-- placeholder là làm mờ -->
                  <!-- thuộc tính readonly sử dụng khi muốn người dùng nhập dữ liệu vào ô input đó -->
                <input type="text" placeholder="Họ và tên">
            </div>

            <div>
                <b>Năm sinh:</b><br>
                <input type="number" placeholder="Năm sinh">
            </div>


            <div>
                <b>Mật khẩu</b><br>
                <input type="password" placeholder="Mật khẩu">
            </div>
<!-- textarea cho phép người dùng nhập nhiều dòng văn bản,khác với input chỉ cho phép nhập 1 dòng -->
            <div>
                <b>Giới thiệu về bản thân</b><br>
                <textarea>Nhập thông tin...</textarea>
            </div>

            <!-- nhập email -->
            <div>
                <b>Email</b><br>
                <input type="email">
            </div>

            <div>
                <!-- số đầu tiên 0 -->
                 <!-- số thứ 2 là 3,9,8 -->
                  <!-- 8 số còn lại là 0-9 -->
                <b>Số điện thoại</b><br>
                <input type="tel" 
                pattern="([0]{1})([3,8,9]{1})([0-9]{8}))">
            </div>

            <div>
                <!-- gender chọn cả nam ,nữ -->
                <b>Giới tính</b><br>
                <input type="radio" name="gioi tinh" value="nam">Nam<br>
                <input type="radio" name="gioi tinh" value="nu">Nữ
            </div>

            <div>
                <!-- checkbox chọn nhiều đối tượng -->
              <b>Sở thích</b><br>  
              Chơi game:<input type="checkbox" name="so thich" value="choi game"><br>
              Nghe nhạc:<input type="checkbox" name="so thich" value="nghe nhac"><br>
              Xem phim:<input type="checkbox" name="so thich" value="xem phim"><br>
            </div>

            <div>
               <b>Trình duyệt web ưa thích</b><br>   
               <select name="browsers">
                <option value="Internet Explorer">Internet Explorer</option>
                <option value="Firefox">Firefox</option>
                <option value="Chrome">Chrome</option>
                <option value="Safari">Safari</option>
                <option value="opera">opera</option>
                <option value="cốc cốc">cốc cốc</option>
               </select>
            </div>
            <!-- 0 <input type="range" id="a" value="50">100 -->



        <div>
            <input type ="submit">
            <button>Xác nhận</button>
            <input type="reset">
        </div>

         


          </form>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/pzL_FW80zoY?si=55sgXCqJsdyPEzN7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <video controls width="560" height="315">
        <source src="/ảnh/video.mp4" type="video/mp4">
        </video>
        <audio controls>
            <source src="/ảnh/âm thanh.mp4" type="audio/mp4">
        </audio>
    </body>
</html>
